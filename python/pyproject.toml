[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intcalc"
version = "0.1.0"
description = "Monthly interest calculation, the Python port of the CBACT04C batch job."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Tests only. Pinned so a later pytest release cannot change what CI runs.
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
include = ["intcalc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
